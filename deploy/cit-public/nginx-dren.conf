        # LitBlogs: only /dren is routed to the persistent local Docker stack.
        location = /dren {
            access_log off;
            error_log /var/log/nginx/litblogs-error.log crit;
            server_tokens off;
            if ($host != drhscit.org) { return 421; }
            return 308 https://drhscit.org/dren/$is_args$args;
        }
        location ^~ /dren/ {
            access_log off;
            error_log /var/log/nginx/litblogs-error.log crit;
            server_tokens off;
            if ($host != drhscit.org) { return 421; }
            if ($scheme = http) { return 308 https://drhscit.org$request_uri; }
            client_max_body_size 102m;
            client_body_timeout 30s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host drhscit.org;
            proxy_set_header X-LitBlogs-Client-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Request-ID "";
            proxy_ssl_server_name on;
            proxy_ssl_name litblogs.cit.internal;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_trusted_certificate /home/litblogs/.local/state/cit-deploy/https/server.crt;
            # The slash strips only /dren/; the app's internal guards still see /api/.
            proxy_pass https://127.0.0.1:18443/;
            proxy_redirect ~^http://drhscit\.org(/.*)$ https://drhscit.org/dren$1;
            proxy_redirect ~^(/api(?:/.*)?)$ /dren$1;
            # HSTS affects a whole host, not a path. Preserve the host's own policy.
            proxy_hide_header Strict-Transport-Security;
        }
