limit_req_zone $binary_remote_addr zone=litblogs_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=litblogs_api:10m rate=120r/m;

log_format litblogs_privacy
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $server_protocol" $status $body_bytes_sent '
    '"$http_user_agent" request_id=$request_id';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/litblogs-access.log litblogs_privacy;
    error_log /var/log/nginx/litblogs-error.log crit;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name litblogs.school.example;
    access_log /var/log/nginx/litblogs-access.log litblogs_privacy;
    error_log /var/log/nginx/litblogs-error.log crit;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    access_log /var/log/nginx/litblogs-access.log litblogs_privacy;
    error_log /var/log/nginx/litblogs-error.log crit;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name litblogs.school.example;

    access_log /var/log/nginx/litblogs-access.log litblogs_privacy;
    error_log /var/log/nginx/litblogs-error.log crit;

    ssl_certificate /etc/litblogs/tls/fullchain.pem;
    ssl_certificate_key /etc/litblogs/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://cdn.tiny.cloud https://*.tiny.cloud; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://cdn.tiny.cloud https://*.tiny.cloud; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://images.unsplash.com https://sp.tinymce.com https://cdn.tiny.cloud https://*.tiny.cloud; media-src 'self' data: blob:; connect-src 'self' https://accounts.google.com https://login.microsoftonline.com https://graph.microsoft.com https://cdn.tiny.cloud https://*.tiny.cloud https://sp.tinymce.com; frame-src 'self' https://accounts.google.com https://login.microsoftonline.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # OAuth sign-in uses reviewed cross-origin popup providers.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    root /opt/litblogs/current/litblogs/dist;
    index index.html;

    location = /index.html {
        # Nginx does not inherit any parent add_header once this location sets
        # Cache-Control, so repeat the complete reviewed security-header set.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://cdn.tiny.cloud https://*.tiny.cloud; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://cdn.tiny.cloud https://*.tiny.cloud; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://images.unsplash.com https://sp.tinymce.com https://cdn.tiny.cloud https://*.tiny.cloud; media-src 'self' data: blob:; connect-src 'self' https://accounts.google.com https://login.microsoftonline.com https://graph.microsoft.com https://cdn.tiny.cloud https://*.tiny.cloud https://sp.tinymce.com; frame-src 'self' https://accounts.google.com https://login.microsoftonline.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location ~* "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(?:css|js|mjs|map|png|jpe?g|gif|svg|webp|avif|woff2?)$" {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://cdn.tiny.cloud https://*.tiny.cloud; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://cdn.tiny.cloud https://*.tiny.cloud; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://images.unsplash.com https://sp.tinymce.com https://cdn.tiny.cloud https://*.tiny.cloud; media-src 'self' data: blob:; connect-src 'self' https://accounts.google.com https://login.microsoftonline.com https://graph.microsoft.com https://cdn.tiny.cloud https://*.tiny.cloud https://sp.tinymce.com; frame-src 'self' https://accounts.google.com https://login.microsoftonline.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/auth/ {
        limit_req zone=litblogs_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/api/(?:upload/image|user/upload-(?:profile|cover)-image)$ {
        client_max_body_size 12m;
        limit_req zone=litblogs_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /api/upload/file {
        client_max_body_size 27m;
        limit_req zone=litblogs_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~ ^/api/upload(?:/video)?$ {
        client_max_body_size 102m;
        limit_req zone=litblogs_api burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        limit_req zone=litblogs_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://cdn.tiny.cloud https://*.tiny.cloud; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://cdn.tiny.cloud https://*.tiny.cloud; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://images.unsplash.com https://sp.tinymce.com https://cdn.tiny.cloud https://*.tiny.cloud; media-src 'self' data: blob:; connect-src 'self' https://accounts.google.com https://login.microsoftonline.com https://graph.microsoft.com https://cdn.tiny.cloud https://*.tiny.cloud https://sp.tinymce.com; frame-src 'self' https://accounts.google.com https://login.microsoftonline.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
