# Full configuration for the non-root container gateway. TLS terminates at the
# school-controlled edge; the application validates the original Host value.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Only the actual peer address selects a rate bucket. Until school IT
    # configures verified edge address handling, proxied clients share a bucket.
    limit_req_zone $binary_remote_addr zone=litblogs_auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=litblogs_api:10m rate=120r/m;
    limit_req_status 429;

    # Docker service addresses can change on application recreation. The shared
    # upstream zone and resolve flag avoid retaining the previous container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    upstream litblogs_backend {
        zone litblogs_backend 64k;
        server app:5000 resolve;
    }

    # Preserve the application's stricter private-file CSP and immutable asset
    # caching. Locally generated gateway responses receive restrictive defaults.
    map $upstream_http_content_security_policy $litblogs_gateway_csp {
        "" "default-src 'none'; frame-ancestors 'none'; sandbox";
        default "";
    }
    map $upstream_http_cache_control $litblogs_gateway_cache {
        "" "no-store";
        default "";
    }
    map $upstream_http_strict_transport_security $litblogs_gateway_hsts {
        "" "max-age=31536000; includeSubDomains";
        default "";
    }

    server {
        listen 5000;
        server_name _;

        client_max_body_size 2m;
        client_body_timeout 15s;
        client_header_timeout 10s;
        keepalive_timeout 30s;
        send_timeout 30s;

        add_header Content-Security-Policy $litblogs_gateway_csp always;
        add_header Cache-Control $litblogs_gateway_cache always;
        add_header Strict-Transport-Security $litblogs_gateway_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_intercept_errors off;

        location = /container-gateway-health {
            return 204;
        }

        location /api/auth/ {
            limit_req zone=litblogs_auth burst=5 nodelay;
            proxy_pass http://litblogs_backend;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ~ ^/api/(?:upload/image|user/upload-(?:profile|cover)-image)$ {
            client_max_body_size 12m;
            limit_req zone=litblogs_api burst=10 nodelay;
            proxy_pass http://litblogs_backend;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location = /api/upload/file {
            client_max_body_size 27m;
            limit_req zone=litblogs_api burst=5 nodelay;
            proxy_pass http://litblogs_backend;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location ~ ^/api/upload(?:/video)?$ {
            client_max_body_size 102m;
            limit_req zone=litblogs_api burst=3 nodelay;
            proxy_pass http://litblogs_backend;
            proxy_connect_timeout 3s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /api/ {
            limit_req zone=litblogs_api burst=30 nodelay;
            proxy_pass http://litblogs_backend;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # All assets, SPA routes and private uploads remain application-owned.
        # There is deliberately no root, alias, cache, or filesystem fallback.
        location / {
            proxy_pass http://litblogs_backend;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
