# Socket access is only for the official initial-cluster script and local DBA.
local all postgres peer
local all all reject
hostssl litblogs postgres all scram-sha-256
hostssl litblogs litblogs_migrator all scram-sha-256
hostssl litblogs litblogs_runtime all scram-sha-256
hostssl litblogs litblog_account_operator all scram-sha-256
hostssl litblogs litblog_invitation_operator all scram-sha-256
hostssl litblogs litblogs_backup all scram-sha-256
host all all all reject
