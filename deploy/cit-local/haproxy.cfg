# The only published listener is host 127.0.0.1:18443. The default private Host
# supports SSH tunnels; an explicitly configured outer proxy can expose /dren.
global
    presetenv LITBLOGS_GATEWAY_HOST litblogs.cit.internal:18443
    presetenv LITBLOGS_TRUSTED_PROXY_CIDR 127.0.0.1/32
    log stdout format raw local0 warning
    maxconn 512
    nbthread 1
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    timeout connect 3s
    timeout client 120s
    timeout server 120s
    timeout http-request 15s
    timeout http-keep-alive 30s
    timeout queue 15s
    timeout check 5s
    # Do not log request paths, query strings, cookies, or student identifiers.
    # Do not retry application mutations after an ambiguous upstream failure.
    retries 0

resolvers docker
    nameserver embedded 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold obsolete 5s
    hold nx 3s
    hold timeout 3s
    hold refused 3s
    hold other 3s

frontend local_https
    # HTTP/1.1 plus rejecting transfer-encoding makes every accepted request body
    # Content-Length bounded. No 102 MiB buffering allocation per connection.
    bind :5443 ssl crt /usr/local/etc/haproxy/haproxy.pem alpn http/1.1
    http-request deny deny_status 400 unless { req.hdr_cnt(host) eq 1 }
    # Values remain samples, never an interpolated ACL expression or regex.
    acl safe_gateway_host env(LITBLOGS_GATEWAY_HOST) -m reg ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?$
    http-request set-var(txn.gateway_host) env(LITBLOGS_GATEWAY_HOST),lower
    http-request deny deny_status 421 unless safe_gateway_host { req.hdr(host),lower,strcmp(txn.gateway_host) eq 0 }
    http-request return status 411 content-type text/plain string "Content-Length required" if { req.hdr(transfer-encoding) -m found }
    # Match the application-decoded path, including percent-encoded auth paths.
    # The default JSON/form cap remains 2 MiB; larger bodies are upload-only.
    http-request set-var(txn.route) path,url_dec
    acl auth_route var(txn.route) -m beg /api/auth/
    acl api_route var(txn.route) -m beg /api/
    acl image_upload var(txn.route) -m str /api/upload/image /api/user/upload-profile-image /api/user/upload-cover-image
    acl document_upload var(txn.route) -m str /api/upload/file
    acl video_upload var(txn.route) -m str /api/upload /api/upload/video
    acl assignment_write var(txn.route) -m reg ^/api/assignments/[^/]+/(draft|submit)$
    http-request set-var(txn.body_limit) int(2097152)
    http-request set-var(txn.body_limit) int(12582912) if image_upload
    http-request set-var(txn.body_limit) int(28311552) if document_upload
    http-request set-var(txn.body_limit) int(106954752) if video_upload
    # Match the private assignment parser: 6 * 1,000,000 + 64 KiB JSON overhead.
    http-request set-var(txn.body_limit) int(6065536) if assignment_write
    http-request deny deny_status 413 if { req.body_size,sub(txn.body_limit) gt 0 }

    # Original sustained limits: auth 10/minute, API 120/minute. These bounded
    # sliding windows replace the prior gateway's leaky-bucket burst handling.
    # Local/tunneled clients share their actual socket peer's bucket by default.
    # Only one explicitly configured Docker gateway address may attest a client
    # identity. Broad CIDRs cannot match; untrusted and malformed headers retain
    # the real socket source. Do not change src or forward identity to the app.
    acl exact_proxy env(LITBLOGS_TRUSTED_PROXY_CIDR) -m reg ^([0-9]{1,3}\.){3}[0-9]{1,3}/32$
    http-request set-var(txn.proxy_ip) env(LITBLOGS_TRUSTED_PROXY_CIDR),field(1,/)
    acl from_proxy src,strcmp(txn.proxy_ip) eq 0
    acl single_client req.hdr_cnt(X-LitBlogs-Client-IP) eq 1
    acl plain_client req.fhdr(X-LitBlogs-Client-IP) -m reg ^[0-9]+(\.[0-9]+){3}$ ^[0-9a-fA-F]*:[0-9a-fA-F:.]*:[0-9a-fA-F:.]*$
    http-request set-var(txn.client_ip) src
    http-request set-var(txn.client_ip) req.fhdr(X-LitBlogs-Client-IP),ipmask(32,128) if exact_proxy from_proxy single_client plain_client
    http-request track-sc0 var(txn.client_ip) table auth_requests if auth_route
    http-request track-sc1 var(txn.client_ip) table api_requests if api_route !auth_route
    http-request deny deny_status 429 if auth_route { sc_http_req_rate(0,auth_requests) gt 10 }
    http-request deny deny_status 429 if api_route !auth_route { sc_http_req_rate(1,api_requests) gt 120 }

    # Preserve Host and Range/If-Range. Discard client-supplied proxy identity;
    # the app independently enforces its configured HTTPS origin and cookies.
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Real-IP
    http-request del-header X-Request-ID
    http-request del-header X-LitBlogs-Client-IP

    # Preserve application-owned CSP/cache policies, including private media.
    http-after-response set-header X-Content-Type-Options nosniff
    http-after-response set-header Referrer-Policy no-referrer
    http-after-response set-header Strict-Transport-Security "max-age=31536000" unless { res.hdr(Strict-Transport-Security) -m found }
    http-after-response set-header Cache-Control no-store unless { res.hdr(Cache-Control) -m found }
    http-after-response set-header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" unless { res.hdr(Content-Security-Policy) -m found }
    default_backend litblogs

backend auth_requests
    stick-table type ipv6 size 10k expire 2m store http_req_rate(60s)

backend api_requests
    stick-table type ipv6 size 10k expire 2m store http_req_rate(60s)

backend litblogs
    balance roundrobin
    option httpchk
    http-check send meth GET uri /api/health/ready ver HTTP/1.1 hdr Host %[env(LITBLOGS_GATEWAY_HOST)] hdr Accept application/json
    http-check expect status 200
    # Compose adds one A record per replica. Docker DNS refresh handles scaling
    # and replacement without pinning container addresses or gateway restarts.
    server-template app 1-3 app:5000 check inter 5s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr none
