name: Container verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-smoke:
    name: Fresh container startup and persistence
    runs-on: ubuntu-latest
    # Includes bounded startup, two readiness windows, probes, and cleanup.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build and exercise a disposable stack with synthetic settings
        run: python deploy/container/smoke.py
